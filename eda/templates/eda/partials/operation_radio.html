<label class="block relative cursor-pointer group">
    <input type="radio" name="{{ name|default:'action' }}" value="{{ value }}" class="peer sr-only">

    <!-- Card Content -->
    <div
        class="flex items-center gap-3 p-3 rounded bg-chaos-900 border border-scarlet-900/30 text-gray-400 transition-all duration-300 peer-checked:bg-scarlet-900/20 peer-checked:border-scarlet-500 peer-checked:text-white peer-checked:shadow-[inset_0_0_15px_rgba(255,41,66,0.2)] hover:bg-scarlet-900/10">
        <div
            class="w-8 h-8 rounded flex items-center justify-center bg-black/50 border border-scarlet-900/50 peer-checked:border-scarlet-500 text-scarlet-700 peer-checked:text-scarlet-500 transition-colors">
            <i class="fa-solid fa-{{ icon }}"></i>
        </div>
        <span class="font-bold text-sm tracking-wide">{{ label }}</span>
        <i
            class="fa-solid fa-circle-check ml-auto opacity-0 -translate-x-2 peer-checked:opacity-100 peer-checked:translate-x-0 transition-all text-scarlet-500"></i>
    </div>

    <!-- Hidden Settings (Revealed via Peer Checked) -->
    <div
        class="max-h-0 overflow-hidden opacity-0 peer-checked:max-h-40 peer-checked:opacity-100 peer-checked:mt-2 transition-all duration-500 ease-in-out pl-4 border-l-2 border-scarlet-500/30">

        {% if is_select %}
        <select name="{{ select_name }}"
            class="w-full bg-black/50 border border-scarlet-900 text-white text-sm rounded p-2 mb-2 focus:border-scarlet-500 outline-none">
            <option value="numeric">Numeric (Float/Int)</option>
            <option value="datetime">DateTime</option>
            <option value="categorical">Categorical (String)</option>
        </select>
        {% elif input_name %}
        <input type="text" name="{{ input_name }}" placeholder="{{ input_placeholder }}"
            class="w-full bg-black/50 border border-scarlet-900 text-white text-sm rounded p-2 mb-2 focus:border-scarlet-500 outline-none">
        {% endif %}

        <button type="submit"
            class="w-full py-2 bg-scarlet-600 hover:bg-scarlet-500 text-white text-xs font-bold uppercase tracking-widest rounded shadow-lg shadow-scarlet-900/50 transition-all hover:scale-[1.02]">
            {{ btn_text }}
        </button>
    </div>
</label>
