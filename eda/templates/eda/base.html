<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataInsight Pro{% endblock %}</title>

    <!-- Fonts: Outfit (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" charset="utf-8"></script>

    <style>
        /* =========================================
           AVENGERS DATA HUB - THEMED DESIGN SYSTEM
           ========================================= */
        :root {
            --bg-primary: #05070a;
            --bg-secondary: #0a0d14;
            --bg-surface: #10141d;
            --primary: #00e5ff;
            /* S.H.I.E.L.D. Blue */
            --secondary: #e62117;
            /* Stark Red */
            --accent: #f2c94c;
            /* Stark Gold */
            --success: #4ade80;
            /* Hulk Green */
            --warning: #fbbf24;
            --danger: #f87171;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.1);

            --iron-red: #e62117;
            --iron-gold: #f2c94c;

            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-24: 24px;
            --space-32: 32px;
            --space-48: 48px;
            --space-64: 64px;

            --transition: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 15px;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(230, 33, 23, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Avengers Special Classes */
        .wanda-text {
            color: var(--iron-red);
            text-shadow: 0 0 10px rgba(230, 33, 23, 0.4);
            letter-spacing: 1px;
        }

        .stark-card {
            border: 1px solid var(--iron-gold) !important;
            box-shadow: 0 0 15px rgba(242, 201, 76, 0.1);
        }

        .holo-plate {
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1);
            position: relative;
        }

        .holo-plate::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(100%);
                opacity: 0;
            }
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: var(--space-32);
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        /* Navbar */
        .navbar {
            background: rgba(5, 7, 10, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.15);
            padding: var(--space-16) var(--space-48);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-icon {
            color: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        .nav-item {
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            gap: 10px;
            border: none;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--bg-primary);
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.2);
        }

        .btn-primary:hover {
            background: #4defff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 229, 255, 0.4);
        }

        /* Hero Buttons */
        .thor-btn {
            background: linear-gradient(135deg, #004b8d, var(--primary)) !important;
            color: white !important;
            position: relative;
            overflow: hidden;
        }

        .thor-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: 0.5s;
        }

        .thor-btn:hover::before {
            opacity: 1;
        }

        .hulk-btn {
            background: var(--success);
            color: #052e16;
            animation: hulk-pulse 2s infinite;
        }

        @keyframes hulk-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        /* Glass Card */
        .glass-card {
            background: rgba(16, 20, 29, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .table-container {
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .table th {
            background: rgba(0, 229, 255, 0.05);
            color: var(--primary);
            padding: 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--primary);
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-secondary);
        }

        /* Toast */
        .toast {
            background: var(--bg-surface);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Utility */
        .flex {
            display: flex;
        }

        .gap-16 {
            gap: 16px;
        }

        .w-full {
            width: 100%;
        }

        .text-center {
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fa-solid fa-shield-halved brand-icon"></i>
                <span>Avengers Data Hub</span>
            </div>

            <div class="nav-links">
                <a href="{% url 'upload' %}"
                    class="nav-item {% if request.resolver_match.url_name == 'upload' %}active{% endif %}">
                    <i class="fa-solid fa-satellite-dish"></i> <span>Uplink</span>
                </a>
                {% if file_id %}
                <a href="{% url 'eda_report' file_id=file_id %}"
                    class="nav-item {% if request.resolver_match.url_name == 'eda_report' %}active{% endif %}">
                    <i class="fa-solid fa-file-shield"></i> <span>Protocol</span>
                </a>
                <a href="{% url 'clean_data' file_id=file_id %}"
                    class="nav-item {% if request.resolver_match.url_name == 'clean_data' %}active{% endif %}">
                    <i class="fa-solid fa-vial-virus"></i> <span>Refine</span>
                </a>
                <a href="{% url 'visualize_data' file_id=file_id %}"
                    class="nav-item {% if request.resolver_match.url_name == 'visualize_data' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie"></i> <span>JARVIS</span>
                </a>
                <a href="{% url 'ask_ai' file_id=file_id %}"
                    class="nav-item {% if request.resolver_match.url_name == 'ask_ai' %}active{% endif %}">
                    <i class="fa-solid fa-brain"></i> <span>Oracle</span>
                </a>
                {% endif %}
            </div>

            <div class="nav-actions">
                <a href="#" class="btn btn-secondary stark-link" style="padding: 8px 12px;"><i
                        class="fa-brands fa-github"></i></a>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <footer
            style="text-align: center; padding: var(--space-48) var(--space-32); color: var(--text-muted); font-size: 13px; border-top: 2px solid var(--glass-border);">
            &copy; 2026 STARK INDUSTRIES • GLOBAL DEFENSE & DATA INITIATIVE
        </footer>
    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let icon = 'fa-info-circle';
            let color = 'var(--primary)';
            if (type === 'success') { icon = 'fa-check-circle'; color = 'var(--success)'; }
            if (type === 'error') { icon = 'fa-exclamation-circle'; color = 'var(--danger)'; }

            toast.innerHTML = `
                <i class="fa-solid ${icon}" style="color: ${color}"></i>
                <span style="font-size: 14px; font-weight: 500;">${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = '200ms ease-in';
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
