<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automated Insights{% endblock %}</title>

    <!-- Fonts: Cinzel (Mystical Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        scarlet: {
                            50: '#fff0f3',
                            100: '#ffe3e8',
                            200: '#ffc9d2',
                            300: '#ff9ea6',
                            400: '#ff6675',
                            500: '#ff2942', // Base Scarlet
                            600: '#e60026',
                            700: '#c2001e',
                            800: '#9f0019',
                            900: '#830519', // Deep Blood
                            950: '#4a000a',
                        },
                        chaos: {
                            100: '#2d0a10',
                            200: '#1a0508',
                            300: '#0f0204', // Void
                        }
                    },
                    fontFamily: {
                        mystic: ['Cinzel', 'serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(255, 41, 66, 0.5)',
                        'chaos': '0 0 40px rgba(255, 41, 66, 0.3), 0 0 80px rgba(131, 5, 25, 0.2)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" charset="utf-8"></script>

    <!-- Custom Chaos Styles -->
    <style>
        /* === SCARLET PROTOTYPE THEME === */
        :root {
            --primary: #ff2942;
            --primary-dark: #9f0019;
            --glow: rgba(255, 41, 66, 0.6);
            --bg-void: #050102;
        }

        body {
            background-color: var(--bg-void);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Mystical Typography */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .mystic-text {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        h1 {
            background: linear-gradient(180deg, #fff 0%, #ff2942 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 41, 66, 0.5);
        }

        /* Glassmorphism Cards with Chaos Edge */
        .chaos-card {
            background: rgba(26, 5, 8, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 41, 66, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .chaos-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(255, 41, 66, 0.3);
            transform: translateY(-2px);
        }

        .chaos-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 41, 66, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .chaos-card:hover::before {
            opacity: 1;
        }

        /* Buttons: Chaos Blasts */
        .btn-chaos {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.75rem 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 41, 66, 0.2);
        }

        .btn-chaos::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 41, 66, 0.8), transparent);
            transition: 0.5s;
        }

        .btn-chaos:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 40px var(--primary);
            text-shadow: 0 0 10px white;
        }

        .btn-chaos:hover::after {
            left: 100%;
        }

        /* Navigation: floating ancient tech */
        .nav-link {
            position: relative;
            color: #a1a1aa;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: 0.3s;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        /* Particle Canvas */
        #chaos-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Loading Overlay */
        #reality-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="antialiased min-h-screen flex flex-col">
    <canvas id="chaos-canvas"></canvas>

    <!-- Initial Page Load Transition -->
    <div id="reality-loader">
        <div class="text-scarlet-500 font-mystic text-4xl animate-pulse"> Reality Loading... </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 border-b border-scarlet-900/30 bg-chaos-300/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-bolt text-scarlet-500 text-2xl animate-pulse"></i>
                <span class="font-mystic text-xl font-bold tracking-widest text-white">
                    Data<span class="text-scarlet-500 text-shadow-glow">Witch</span>
                </span>
            </div>

            <div class="flex gap-8">
                {% if file_id %}
                <a href="{% url 'upload' %}" class="nav-link font-mystic text-sm uppercase tracking-wide">Upload</a>
                <a href="{% url 'eda_report' file_id=file_id %}"
                    class="nav-link font-mystic text-sm uppercase tracking-wide">The Report</a>
                <a href="{% url 'clean_data' file_id=file_id %}"
                    class="nav-link font-mystic text-sm uppercase tracking-wide">Cleanse Reality</a>
                <a href="{% url 'visualize_data' file_id=file_id %}"
                    class="nav-link font-mystic text-sm uppercase tracking-wide">Visions</a>
                <a href="{% url 'ask_ai' file_id=file_id %}"
                    class="nav-link font-mystic text-sm uppercase tracking-wide">Chaos Mind</a>
                {% else %}
                <a href="{% url 'upload' %}"
                    class="nav-link font-mystic text-sm uppercase tracking-wide text-scarlet-400">
                    Begin Ritual
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24 px-6 relative z-10 w-full max-w-7xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-scarlet-900/30 py-8 mt-12 text-center">
        <p class="font-mystic text-scarlet-800 text-xs tracking-[0.2em] uppercase">
            Powered by Chaos Magic &copy; 2026
        </p>
    </footer>

    <!-- Scripts -->
    <script>
        // Page Load Transition
        window.addEventListener('load', () => {
            const loader = document.getElementById('reality-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 1000);
        });

        // Chaos Particle System
        const canvas = document.getElementById('chaos-canvas');
        const ctx = canvas.getContext('2d');

        // Resize
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particles
        const particles = [];
        const particleCount = 60;

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.8 ? '#ffffff' : '#ff2942'; // White or Scarlet
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around
                if (this.x < 0) this.x = w;
                if (this.x > w) this.x = 0;
                if (this.y < 0) this.y = h;
                if (this.y > h) this.y = 0;

                // Pulse alpha
                this.alpha += (Math.random() - 0.5) * 0.02;
                if (this.alpha < 0.1) this.alpha = 0.1;
                if (this.alpha > 0.6) this.alpha = 0.6;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Init
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Chaos Connections
        function animate() {
            ctx.clearRect(0, 0, w, h);

            // Draw gradient background
            const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w);
            gradient.addColorStop(0, '#1a0508'); // Dark Scarlet center
            gradient.addColorStop(1, '#000000'); // Black edges
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Connections (Chaos Web)
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 41, 66, ${0.1 - distance / 1200})`; // Faint red web
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Mouse Interaction (Chaos Blast)
        document.addEventListener('click', (e) => {
            const blast = document.createElement('div');
            blast.style.position = 'fixed';
            blast.style.left = e.clientX + 'px';
            blast.style.top = e.clientY + 'px';
            blast.style.transform = 'translate(-50%, -50%)';
            blast.style.width = '10px';
            blast.style.height = '10px';
            blast.style.background = 'radial-gradient(circle, #fff, #ff2942, transparent)';
            blast.style.borderRadius = '50%';
            blast.style.pointerEvents = 'none';
            blast.style.zIndex = '9999';
            blast.style.boxShadow = '0 0 50px 20px rgba(255, 41, 66, 0.8)';
            document.body.appendChild(blast);

            const anim = blast.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: 'translate(-50%, -50%) scale(20)', opacity: 0 }
            ], {
                duration: 600,
                easing: 'ease-out'
            });

            anim.onfinish = () => blast.remove();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
